[package]
name = "stlcat"
version = "0.1.0"
edition = "2021"
description = "Preview STL models in Kitty-compatible terminals"
license = "MIT"

[dependencies]
base64 = "0.22"
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.28"
image = { version = "0.25", default-features = false, features = ["png"] }
stl_io = "0.8"
